# P1's environment: one served model, on the reference machine (a DGX Spark).
#
#   cd p1-verifiers/env
#   docker compose up -d
#   # then poll until it answers - see README.md, "Is it up?"
#
# Every value can be overridden from the environment or from an ignored .env file, so
# switching model or image is one variable instead of an edit. The names are listed in
# .env.example.
#
# Four things below are the way they are because the other way cost a restart on this machine:
#
# 1. `command` does not begin with `vllm serve`. The image's ENTRYPOINT is already
#    ["vllm","serve"] - `docker image inspect vllm/vllm-openai:v0.27.1` shows it - so repeating
#    it fails with "unrecognized arguments: serve <model>".
# 2. The Hugging Face cache is mounted by absolute path. A `~` in a compose file expands to
#    /root when the command is run under sudo, which hands the container an empty cache and
#    starts a download of weights that are already on the disk.
# 3. `--served-model-name` is a fixed string, and clients must use exactly that string. A name
#    differing by one hyphen is a 404 here and a context error on another server; both look
#    like a model problem and neither is one.
# 4. There is no healthcheck, deliberately. The image's interpreter name is not guaranteed, and
#    a healthcheck that reports unhealthy while the service is fine is worse than no
#    healthcheck - that one has already cost an afternoon. Poll /health from outside instead.

services:
  p1-model:
    # The pinned stable image, already present on the reference machine. If a checkpoint needs
    # newer NVFP4 kernels, fall back to the model-family image rather than to a nightly.
    image: ${ARL_VLLM_IMAGE:-vllm/vllm-openai:v0.27.1}
    container_name: p1-model

    # The GB10's memory is unified: weights, KV cache, the OS and the page cache all come out of
    # one 128 GB pool. One model at a time, and the reservation form below is the one that
    # works here (it resolves through CDI; there is no nvidia runtime on this host).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]

    # A ceiling on the container, because the pool is shared with the host and with anything else
    # running: 1.7B in bf16 is 3.4 GB and the reservation at --gpu-memory-utilization 0.08 is about
    # 10 GB, so 32 GB leaves room and still contains a runaway. `memswap_limit` equal to `mem_limit`
    # means "no swap": a container that exceeds this is killed rather than dragging the host into
    # swap, which is what took the login session down on 2026-10-22.
    mem_limit: ${ARL_MODEL_MEM_LIMIT:-32g}
    memswap_limit: ${ARL_MODEL_MEM_LIMIT:-32g}

    # vLLM uses shared memory for its worker queues; the default 64 MB is not it.
    ipc: host

    ports:
      - "${ARL_PORT:-8000}:8000"

    volumes:
      - /home/yusiwen/.cache/huggingface:/root/.cache/huggingface
      # Kernel compile cache. The first start pays for the compilation, every later start does
      # not - which is the difference between a two-minute and an eight-minute startup.
      - /home/yusiwen/.cache/vllm:/root/.cache/vllm

    # NOTE: no `vllm serve` here - the entrypoint already is that (see comment 1 above).
    # P1 sends one request at a time and its prompts are short, so the KV budget stays small:
    # max-model-len is a per-request limit rather than a reservation, and 8192 is far more than
    # this task set needs. Raise it only when something else will use this server too.
    #
    # The default model is the 1.7B chat model from the Qwen3 family: same architecture as
    # everything else this machine serves, small enough to start in seconds, and *instruction
    # tuned* - which the cached nvidia/Qwen3-8B-NVFP4 is not, and P1's task shape needs it to
    # be. The first start downloads it if it is missing; env/README.md has the one-liner to
    # fetch the weights without starting a server.
    #
    # --trust-remote-code stays in the command because the NVFP4 checkpoints need it and a
    # compose command cannot branch on which model was chosen. For the default 1.7B it is
    # simply ignored - a flag that does nothing beats a start that fails on a technicality.
    #
    # --gpu-memory-utilization is a CAP, not a consumption, and that distinction cost a wrong
    # diagnosis: Qwen3-1.7B measured 3.4 GiB resident under both 0.80 and 0.08 (weights, KV cache
    # for 8192 tokens x 8 sequences, CUDA context). 0.80 was the 27B-era figure; on a 1.7B model it
    # only widens what one long-context or high-concurrency request may reserve out of the shared
    # pool. 0.08 leaves the model ~10 GB of headroom and keeps the rest for training, the OS and the
    # page cache. Raise it deliberately, per model, rather than by copying the old value.
    #
    # --gpu-memory-utilization 0.80 rather than the vendor's 0.85: the failure mode when the
    # unified pool runs out is earlyoom killing the scheduler, which costs a restart rather
    # than a flag. Raise it when the machine is dedicated to this.
    command: >
      ${ARL_MODEL:-Qwen/Qwen3-1.7B}
      --served-model-name ${ARL_SERVED_NAME:-qwen3-1.7b}
      --max-model-len ${ARL_MAX_MODEL_LEN:-8192}
      --max-num-seqs ${ARL_MAX_NUM_SEQS:-8}
      --gpu-memory-utilization ${ARL_GPU_MEMORY_UTILIZATION:-0.08}
      --trust-remote-code

    # "no" on purpose: this machine is powered off daily, and a model that resurrects itself on
    # boot is a surprise, not a convenience. Start it when you are about to use it.
    restart: "no"
