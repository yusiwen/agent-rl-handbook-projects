# P1 on the reference machine. This config must run as written; anything that cannot
# belongs in a `rented-*.yaml` file instead.
#
# Reference machine: a DGX Spark (GB10, aarch64 + sm_121, 128 GB unified memory,
# ~273 GB/s). The two fields left empty at the bottom are the point of the exercise:
# measure them once, then plan with your numbers instead of anybody's estimates.

project: p1-verifiers
tier: spark
book_chapter: 5

model:
  id: qwen3-1.7b               # the name the server answers to, not the Hugging Face id: it is
                               # what `--served-model-name` sets in env/docker-compose.yaml, and
                               # what a client must send. P1 preflights it against /v1/models.
  weights: Qwen/Qwen3-1.7B     # what the container loads: the Qwen3 chat model, instruction
                               # tuned. Not nvidia/Qwen3-8B-NVFP4, which is a base checkpoint
  dtype: auto                  # let the checkpoint decide; only quantised weights need pinning
  attention: sdpa              # flash_attention_2 has no sm_121 wheel; do not reach for it
  trust_remote_code: false     # nothing in this checkpoint needs custom code

serving:
  compose: env/docker-compose.yaml   # the server this config describes; start it from there
  backend: vllm                # the pinned image in that compose; sglang is the MoE alternative
  port: 8000
  max_model_len: 8192
  gpu_memory_utilization: 0.80 # must match the compose: the pool is unified with the OS
  max_num_seqs: 8
  smoke_test: /v1/models and /tokenize   # the two endpoints P1 cannot work without

sampling:
  task_set: p1-verifiers/fixtures/tasks.jsonl
  prompts: 10
  samples_per_prompt: 2
  temperature: 0.7
  top_p: 0.95
  max_tokens: 512

budget:
  decode_tokens_per_round: 10240     # 10 prompts x 2 samples x <=512 tokens: arithmetic
  measured_tokens_per_second: null   # YOUR NUMBER (arithmetic above is not a measurement)
  estimated_seconds_per_round: null  # derive from the measurement, not from a guess

verifiers:
  exact_match: implemented
  numeric: implemented
  unit_test: implemented
  logic_puzzle: implemented
